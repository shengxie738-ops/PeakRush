server:
  port: 8081
  address: ${SERVER_ADDRESS:127.0.0.1}
  error:
    include-message: never
spring:
  application:
    name: peakrush
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:13306/peakrush?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USER:peakrush}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 3000
      connection-init-sql: "SET time_zone='+00:00'"
  sql:
    init:
      mode: always
      encoding: UTF-8
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
      timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 3000
        max.block.ms: 3000
    consumer:
      group-id: peakrush-orders
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
  task:
    scheduling:
      pool:
        size: 4
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: never
peakrush:
  jwt-secret: ${JWT_SECRET:}
  order-ttl-seconds: ${ORDER_TTL_SECONDS:900}
  pending-timeout-seconds: ${PENDING_TIMEOUT_SECONDS:1800}
  bridge:
    # 续租在每轮开始、每条 enqueue 前后以及 awaitSends 分段等待期间执行（默认 1 秒间隔），
    # 单次 enqueue 最长同步阻塞 max.block.ms=3 秒。20 秒只覆盖“单条阻塞 + 确认”，
    # 不覆盖整批等待：因此 Kafka ACK 后的故障暂停被钳制在 20-12=8 秒以内。
    # 进程停顿超过该阈值时按至少一次交付，由稳定 requestId 约束下游幂等。
    claim-idle-seconds: ${BRIDGE_CLAIM_IDLE_SECONDS:20}
    # 实例稳定名（接管演练用）：同名重启仍是原实例，不同名才是另一实例。留空则使用随机 UUID。
    instance-name: ${BRIDGE_INSTANCE_NAME:}
