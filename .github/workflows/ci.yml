name: PeakRush checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0.30
        env:
          MYSQL_DATABASE: peakrush_ci
          MYSQL_ROOT_PASSWORD: peakrush_ci_disposable_password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 13306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppeakrush_ci_disposable_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7.4.2
        ports:
          - 16379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      PEAKRUSH_INTEGRATION_TESTS: 'true'
      PEAKRUSH_MIGRATION_TESTS: 'true'
      PEAKRUSH_V4_TESTS: 'false'
      DB_URL: jdbc:mysql://127.0.0.1:13306/peakrush_ci?serverTimezone=UTC
      DB_USER: root
      DB_PASSWORD: peakrush_ci_disposable_password
      REVIEW_DB_ADMIN_URL: jdbc:mysql://127.0.0.1:13306/?serverTimezone=UTC
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Initialize the disposable test schema
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: >-
          docker exec -i "$MYSQL_CONTAINER"
          mysql --default-character-set=utf8mb4 -uroot -p"$DB_PASSWORD" peakrush_ci
          < backend/src/main/resources/schema.sql
      - run: mvn --batch-mode --no-transfer-progress -f backend/pom.xml verify

  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: gateway/pom.xml
      - run: mvn --batch-mode --no-transfer-progress -f gateway/pom.xml verify

  catalog-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/requirements.txt
      - run: python -m unittest discover -s scripts/tests -v
